<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>验证码 · 弥散光 UI</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5EFE4' stroke='%23CC371F' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../embed-stage.css">
</head>
<body><main><h1>验证码</h1>
<div class="stage"><canvas id="stage" width="1152" height="584" role="img" aria-label="验证码的定稿演示"></canvas><canvas id="glow" width="1152" height="584" aria-hidden="true"></canvas><canvas id="live" width="1152" height="584" tabindex="0" aria-label="验证码可操作画布" hidden></canvas></div>
<fieldset id="panel" disabled aria-label="预览与操作"><button id="mode" type="button" aria-pressed="false">自己操作</button>
<div id="timeline"><button id="play" type="button">播放</button><button id="restart" type="button">从头播放</button><input type="range" id="time" aria-label="演示时间"><output id="readout"></output></div>
<div id="actions" hidden><button type="button" data-act="clear">清空</button><label>演示数字<input id="value" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="输入六位演示数字"></label></div><button id="sound" type="button" aria-pressed="false">开启琴声</button></fieldset><p id="status" role="status" aria-live="polite"></p>
</main><script src="settings.js"></script><script src="vendor/three.js"></script><script src="effect.js"></script><script src="controls.js"></script><script src="piano.js"></script><script src="viewer.js"></script><script src="../../embed-stage.js" defer></script>
</body></html>
