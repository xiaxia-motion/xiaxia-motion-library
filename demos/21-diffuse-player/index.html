<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>波形播放器 · 弥散光 UI</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5EFE4' stroke='%23CC371F' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../embed-stage.css">
</head>
<body><main><h1>波形播放器</h1>
<div class="stage"><canvas id="stage" width="1152" height="584" role="img" aria-label="波形播放器的定稿演示"></canvas><canvas id="glow" width="1152" height="584" aria-hidden="true"></canvas><canvas id="live" width="1152" height="584" tabindex="0" aria-label="波形播放器可操作画布" hidden></canvas></div>
<fieldset id="panel" disabled aria-label="预览与操作"><button id="mode" type="button" aria-pressed="false">自己操作</button>
<div id="timeline"><button id="play" type="button">播放</button><button id="restart" type="button">从头播放</button><input type="range" id="time" aria-label="演示时间"><output id="readout"></output></div>
<div id="actions" hidden><button type="button" data-act="previous">上一首</button><button type="button" data-act="toggle">播放 / 暂停</button><button type="button" data-act="next">下一首</button><label>播放进度<input id="value" type="range" min="0" max="108" step="1" value="28"></label><label>本机音频<input type="file" id="audio-file" accept="audio/*"></label><audio id="audio" preload="metadata"></audio></div></fieldset><p id="status" role="status" aria-live="polite"></p>
</main><script src="settings.js"></script><script src="vendor/three.js"></script><script src="effect.js"></script><script src="controls.js"></script><script src="viewer.js"></script><script src="../../embed-stage.js" defer></script>
</body></html>
