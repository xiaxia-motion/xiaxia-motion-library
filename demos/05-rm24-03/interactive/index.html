<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>次数滚轮 · 夏夏的AI灵感</title><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="rm-kit.css"><link rel="stylesheet" href="rm-tools.css"><style>*{box-sizing:border-box}body{margin:0;background:#edf1f6;color:#334059;font:16px/1.7 "Avenir Next","Hiragino Sans GB",sans-serif}main{max-width:880px;margin:5vh auto;padding:24px}h1{font-size:28px;font-weight:500}.demo{height:min(65vh,540px);min-height:280px;border-radius:28px;overflow:hidden;box-shadow:12px 12px 30px #c4ceda,-12px -12px 30px white}.demo:has([data-scene^="rm"]){height:auto;min-height:390px}.demo [data-scene^="rm"]{height:auto;min-height:390px}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:25px 0}button,select,input{font:inherit}button,select{padding:8px 18px;color:#334059;background:#edf1f6;border:1px solid #c7d0df;border-radius:12px;cursor:pointer}a{color:#6956ae}.note{font-size:14px}footer{margin-top:24px;color:#64748a}</style><main><h1>次数滚轮</h1><p>机械数字滚轮逐档吸附，合计次数同步变化。</p><div class="demo"><div id="effect" data-scene="rm24-03"></div></div><p>第三组初始10次，范围1–30次。向上拖动或按上键增加，下键减少；前两组各10次，合计实时更新。</p><p class="note">阅读文件夹中的“使用说明.md”了解如何交给 AI 修改；“提示词.txt”包含完整提示词。</p><footer>夏夏的AI灵感 · MIT 许可 · 可修改与商用，保留来源和许可说明</footer></main><script src="rm-kit.js"></script><script src="rm-tools.js"></script><script src="components.js"></script><script>const host=document.querySelector('#effect');const motion=XiaMotion.mount(host,'rm24-03');const play=document.querySelector('#play');if(play){function sync(){play.textContent=motion.state().paused?'播放':'暂停';play.setAttribute('aria-pressed',String(!motion.state().paused))}play.onclick=()=>motion.state().paused?motion.play():motion.pause();host.addEventListener('motionstate',sync);sync();document.querySelector('#speed').oninput=e=>{motion.setSpeed(e.target.value);document.querySelector('#rate').value=Number(e.target.value).toFixed(1)+'×'};const palette=document.querySelector('#palette');if(palette)palette.onchange=e=>motion.setPalette(e.target.value)}</script><script src="../../../embed-stage.js" defer></script>
